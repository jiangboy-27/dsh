<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Supabase 连接测试</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #output {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h2>Supabase 测试面板</h2>
    <button id="testBtn">点我：写入并读取数据</button>
    <div id="output">等待测试...</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ⚠️ 注意：把下面两行替换成你自己的真实数据！
        const SUPABASE_URL = 'https://vkllcvlppfzsbtdhhope.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_iuNJ6dW3b0iBFXtVV1Ksug_NKzlvxvR';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const outputDiv = document.getElementById('output');

        document.getElementById('testBtn').addEventListener('click', async () => {
            outputDiv.innerHTML = '正在连接并写入数据...\n';

            // 1. 尝试插入一条数据
            const { data: insertData, error: insertError } = await supabase
                .from('todos')
                .insert({ task: '测试任务_' + new Date().toLocaleTimeString() })
                .select(); // 加 select 才能返回插入的数据

            if (insertError) {
                outputDiv.innerHTML += `❌ 写入失败：${insertError.message}\n`;
                return;
            }

            outputDiv.innerHTML += `✅ 写入成功！\n\n正在读取所有数据...\n`;

            // 2. 尝试读取所有数据
            const { data: selectData, error: selectError } = await supabase
                .from('todos')
                .select('*');

            if (selectError) {
                outputDiv.innerHTML += `❌ 读取失败：${selectError.message}\n`;
                return;
            }

            // 3. 把读到的数据显示在页面上
            outputDiv.innerHTML += `✅ 读取成功！当前数据库里共有 ${selectData.length} 条待办：\n`;
            outputDiv.innerHTML += JSON.stringify(selectData, null, 2);
        });
    </script>
</body>

</html>
