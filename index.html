<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 简易场景 - 测试运行</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 12px;
            border-radius: 16px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="info">Three.js 简易场景 | 立方体 + 球体</div>
    <div id="instructions">自动旋转中 | 拖动鼠标可旋转视角</div>

    <!-- 引入 Three.js 核心库和轨道控制器 (使用 CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. 初始化场景、相机和渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // 深蓝黑色背景

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 3, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 开启阴影效果
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和阴影
        document.body.appendChild(renderer.domElement);

        // --- 2. 添加轨道控制器 (方便用鼠标旋转/缩放) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;      // 启用惯性效果
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;        // 开启自动旋转
        controls.autoRotateSpeed = 2.0;
        controls.enableZoom = true;
        controls.target.set(0, 0.5, 0);

        // --- 3. 添加灯光 ---
        // 环境光，提供基础照明
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 产生阴影的聚光灯
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 10;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 15;
        scene.add(mainLight);

        // 添加一个辅助点光源，让暗部有点颜色
        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);

        // 添加一个背光暖色光源
        const backLight = new THREE.PointLight(0xffaa66, 0.4);
        backLight.position.set(0, 1, -5);
        scene.add(backLight);

        // --- 4. 添加物体 ---

        // 4.1 创建一个彩色立方体 (使用标准材质)
        const cubeGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const cubeMaterial = new THREE.MeshStandardMaterial({
            color: 0xff4d6d,
            roughness: 0.3,
            metalness: 0.1,
            emissive: new THREE.Color(0x330000)
        });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.castShadow = true;
        cube.receiveShadow = true;
        cube.position.set(-1.2, 0.8, 0);
        scene.add(cube);

        // 4.2 创建一个金属质感的球体
        const sphereGeometry = new THREE.SphereGeometry(0.9, 32, 32);
        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0x4d9fff,
            roughness: 0.2,
            metalness: 0.7,
            emissive: new THREE.Color(0x001122)
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        sphere.position.set(1.3, 0.9, 0.5);
        scene.add(sphere);

        // 4.3 添加一个地面平面 (接收阴影)
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a2a3a,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        plane.receiveShadow = true;
        scene.add(plane);

        // 添加一个细微的网格辅助线在地面上方，增加视觉参考
        const gridHelper = new THREE.GridHelper(8, 20, 0x88aaff, 0x445588);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 添加一些漂浮的小粒子作为背景点缀
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 600;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 30;
            posArray[i + 1] = (Math.random() - 0.5) * 20;
            posArray[i + 2] = (Math.random() - 0.5) * 30 - 5; // 分布在场景后方
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.08,
            color: 0x88aaff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 5. 动画循环 ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = performance.now() / 1000; // seconds

            // 让立方体自己旋转
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;

            // 让球体上下浮动
            sphere.position.y = 0.9 + Math.sin(elapsedTime * 2) * 0.15;

            // 让粒子系统缓慢旋转
            particlesMesh.rotation.y += 0.0002;

            // 更新轨道控制器 (自动旋转由 controls.autoRotate 处理)
            controls.update();

            // 渲染
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- 6. 处理窗口大小变化 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>

</html>
